name: Keepalive

on:
  schedule:
    # Hourly. Supabase free tier pauses after 7 days of inactivity, so 24 pings/day
    # gives ~6 days of headroom even if every ping fails.
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hit keepalive endpoint
        env:
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
          KEEPALIVE_SECRET: ${{ secrets.KEEPALIVE_SECRET }}
        run: |
          set -uo pipefail

          if [ -z "${KEEPALIVE_URL:-}" ]; then
            echo "KEEPALIVE_URL repository variable is not set."
            exit 1
          fi

          CURL_ARGS=(
            --silent
            --show-error
            --location
            --max-time 60
            --retry 5
            --retry-delay 10
            --retry-all-errors
            --connect-timeout 15
            --write-out "\n%{http_code}"
            "$KEEPALIVE_URL"
          )

          if [ -n "${KEEPALIVE_SECRET:-}" ]; then
            CURL_ARGS=(--header "Authorization: Bearer $KEEPALIVE_SECRET" "${CURL_ARGS[@]}")
          fi

          # Capture body + HTTP status code on the last line.
          # We treat any HTTP response (even 5xx) as success — the point is to
          # generate traffic to Supabase, not to verify app health.
          # Only a network-level failure (HTTP 000, i.e. no connection at all)
          # is treated as a real error worth alerting on.
          output=$(curl "${CURL_ARGS[@]}" 2>&1) || true
          http_status=$(echo "$output" | tail -1)
          body=$(echo "$output" | head -n -1)

          echo "Response body: $body"
          echo "HTTP status: $http_status"

          if [ "$http_status" = "000" ]; then
            echo "::error::Keepalive failed — no HTTP response (network error or timeout after retries)"
            exit 1
          fi

          echo "Keepalive ok (HTTP $http_status)"

      - name: Ping Supabase directly (independent fallback)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "SUPABASE_URL not set — skipping direct ping"
            exit 0
          fi

          # Query PostgREST directly — this generates real database activity,
          # which is what Supabase's free-tier pause detection actually tracks.
          # /auth/v1/health is a GoTrue health check that does NOT touch the
          # database and does NOT reset the 7-day inactivity timer.
          # || true means this step never fails the workflow.
          curl --silent \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --header "apikey: ${SUPABASE_ANON_KEY:-}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY:-}" \
            "${SUPABASE_URL}/rest/v1/credit_packages?limit=1" \
            -o /dev/null || true

          echo "Direct Supabase PostgREST ping complete"
